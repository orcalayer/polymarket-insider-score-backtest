<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' role='img' aria-labelledby='t d'>
<title id='t'>What carries over on Polymarket: entry price, not foresight</title>
<desc id='d'>Bar chart of rank correlations from period A to period B: first-hour move 0.138, drift from 1 to 24 hours 0.050, pre-registered Early score 0.090.</desc>
<rect width='100%' height='100%' fill='#fcfcfb'/>
<text x='24.0' y='34.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='600' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>What carries over on Polymarket: entry price, not foresight</text>
<text x='24.0' y='56.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Rank correlation between a wallet's period A and period B, 32,867 wallets (49,650 for the score)</text>
<line x1='70' y1='370.0' x2='730' y2='370.0' stroke='#52514e' stroke-width='1.5'/>
<text x='62.0' y='374.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0</text>
<line x1='70' y1='283.3' x2='730' y2='283.3' stroke='#e4e3df' stroke-width='1'/>
<text x='62.0' y='287.3' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0.05</text>
<line x1='70' y1='196.7' x2='730' y2='196.7' stroke='#e4e3df' stroke-width='1'/>
<text x='62.0' y='200.7' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0.10</text>
<line x1='70' y1='110.0' x2='730' y2='110.0' stroke='#e4e3df' stroke-width='1'/>
<text x='62.0' y='114.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0.15</text>
<text x='180.0' y='390.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Move in the first hour</text>
<rect x='163.0' y='130.8' width='34.0' height='239.2' rx='3' fill='#2a78d6'/>
<text x='180.0' y='124.8' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0.138</text>
<text x='400.0' y='390.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Drift from 1 to 24 hours</text>
<rect x='383.0' y='283.3' width='34.0' height='86.7' rx='3' fill='#2a78d6'/>
<text x='400.0' y='277.3' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0.050</text>
<text x='620.0' y='390.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Early score (24 h move)</text>
<rect x='603.0' y='213.3' width='34.0' height='156.7' rx='3' fill='#2a78d6'/>
<text x='620.0' y='207.3' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0.090</text>
<text x='400.0' y='418.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Measured on period A, compared with period B</text>
<text transform='translate(18 240.0) rotate(-90)' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle'>rank correlation</text>
